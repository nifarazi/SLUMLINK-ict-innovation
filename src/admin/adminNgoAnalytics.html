<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SLUMLINK · NGO Analytics</title>
  <link rel="stylesheet" href="adminSlumAnalytics.css" />
  <!-- Poppins font for this project -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar" aria-label="Header">
  <!-- Brand / Logo -->
  <div class="brand clickable" id="brandBtn" aria-label="SlumLink Home" role="button" tabindex="0">
    <img src="/src/images/slum Logo.png" alt="SlumLink Logo" class="logo-mark" />
    <div class="brand-text">SLUMLINK</div>
  </div>

  <!-- Search input -->
  <input type="text" placeholder="Search" class="search" />

  <!-- Admin & Notifications -->
  <div class="top-right">
    <div class="admin">
      <span>Admin ▾</span>
      <div class="admin-dropdown">
        <button class="admin-logout" id="logoutBtn" type="button" aria-label="Log out">Logout</button>
      </div>
    </div>
    <div class="notification-bell-container">
      <a class="bell" href="adminNotification.html" title="Notifications">🔔</a>
      <span class="notification-badge" id="notificationBadge">0</span>
    </div>
  </div>
</header>


  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li><a href="adminSlumAnalytics.html">📊 Slum Analytics</a></li>
        <li class="active"><a href="adminNgoAnalytics.html">📈 NGO Analytics</a></li>
        <li><a href="adminslumdivision.html">🏠 Slum Residents</a></li>
        <li><a href="adminFieldAgents.html">🧑‍💼 Field Agents</a></li>
        <li><a href="adminactivengo.html">✅ Active NGOs</a></li>
        <li><a href="adminlocalauthority.html">🏛 Local Authority</a></li>
        <li><a href="adminVerifyNgo.html">✔ Verify NGOs</a></li>
        <li><a href="adminviewcomplaints.html">📋 View Complaints</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="content">

      <div class="card-grid" id="ngoGrid"></div>

    </main>
  </div>

  <!-- logout modal markup -->
  <div class="modal-overlay" id="logoutModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
      <div class="modal-header" id="logoutTitle">Log out</div>
      <div class="modal-body">You're currently signed in as Admin. Do you want to log out and return to the home page?</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelLogout">Cancel</button>
        <button class="btn btn-primary" id="confirmLogout">Log out</button>
      </div>
    </div>
  </div>

  <script src="adminSlumAnalytics.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var grid = document.getElementById('ngoGrid');

      function renderEmpty(message) {
        if (!grid) return;
        grid.innerHTML = '<div style="color:#8b6f5a;">' + message + '</div>';
      }

      function bindCard(card) {
        card.addEventListener('click', function () {
          var name = (card.textContent || '').trim();
          var target = 'adminShowNgoAnalytics.html';
          if (name) {
            target += '?ngo=' + encodeURIComponent(name);
          }
          window.location.href = target;
        });
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });
      }

      fetch('/api/ngo/active')
        .then(function (response) { return response.json(); })
        .then(function (payload) {
          if (!grid) return;

          if (!payload || payload.status !== 'success' || !Array.isArray(payload.data) || payload.data.length === 0) {
            renderEmpty('No active NGOs found.');
            return;
          }

          grid.innerHTML = '';
          payload.data.forEach(function (ngo) {
            var card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            card.textContent = ngo.org_name;
            grid.appendChild(card);
            bindCard(card);
          });
        })
        .catch(function () {
          renderEmpty('Unable to load NGOs right now.');
        });
    });
  </script>    <script type="module" src="/src/i18n.js"></script>

</html>
